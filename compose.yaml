services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minha_garagem}
      POSTGRES_USER: ${POSTGRES_USER:-garage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Garage: Host=db;Database=${POSTGRES_DB:-minha_garagem};Username=${POSTGRES_USER:-garage};Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: 'true'
      Bootstrap__Email: ${BOOTSTRAP_EMAIL:-}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD:-}
      Storage__Path: /data/uploads
      DataProtection__Path: /data/keys
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - uploads:/data/uploads
      - data_protection:/data/keys
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8080/health/ready]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: src/frontend
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health/live]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  uploads:
  data_protection:
