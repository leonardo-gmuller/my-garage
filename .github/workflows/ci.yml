name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: garage
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: garage_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U garage -d garage_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      GARAGE_TEST_CONNECTION: Host=localhost;Database=garage_ci;Username=garage;Password=ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger trx
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project src/backend/MinhaGaragem.Infrastructure --startup-project src/backend/MinhaGaragem.Api --no-build --configuration Release
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Validate development configuration
        working-directory: .
        run: node scripts/validate-development.mjs
      - name: Check public distribution
        working-directory: .
        run: node scripts/check-public.mjs
